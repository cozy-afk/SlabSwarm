services:
  slabswarm:
    build: .
    image: slabswarm:local
    container_name: slabswarm
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      SLABGRAPH_DATA_DIR: /app/data
    volumes:
      - ./.env:/app/.env:rw
      - ./data:/app/data
    ports:
      - "10.99.0.1:3010:3000"
    networks:
      default:
      slabswarm-internal:
    depends_on:
      slabswarm-db:
        condition: service_healthy
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  slabswarm-db:
    image: postgres:17
    container_name: slabswarm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-slabswarm}
      POSTGRES_USER: ${POSTGRES_USER:-slabswarm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - slabswarm-db-data:/var/lib/postgresql/data
    networks:
      slabswarm-internal:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-slabswarm} -d ${POSTGRES_DB:-slabswarm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1g
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  slabswarm-db-data:

networks:
  slabswarm-internal:
    internal: true
